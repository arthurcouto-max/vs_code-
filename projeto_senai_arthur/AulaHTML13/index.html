<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil Rock.net</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1>Bem-vindo ao Blog Rock.Net

        </h1>
    </header>
    <main>
        <form class="form">
            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;">
                </div>
                <div>
                <img src="logo.png" alt="Foto de perfil" width="150"
                onmouseover="console.log('Mouse sobre a imagem')">
            </div>
            <div class="form-group">
            <label for="nome">Nome:</label>
            <input type="text" class="form-control" id="nome" name="nome" value="Seu nome">
            </div>
            <div class="form-group">
            <label for="nascimento">Nascimento:</label>
            <input type="date" class="form-control" id="nascimento"
                name="nascimento" max="2024-12-31" min="1990-01-01">
                </div>
                <div class="form-group">
            <label for="cpf">CPF:</label>
            <input type="text" class="form-control" id="cpf" name="cpf" 
            value="Seu CPF" onblur="validaCPF()">
            </div>
            <div class="form-field">
            <p>Seu Genero:</p>
            <input class="radio" name="radios" type="radio" id="radioLabel" />
            <label for="radioLabel">Masculino</label>
            </div>
            <div class="form-field">
            <input class="radio" name="radios" type="radio" id="radioLabel2" />
            <label for="radioLabel2">Feminino</label>
            </div>
            <div class="form-field">
        <input type="checkbox" id="checkLabel" class="check" />
        <label for="checkLabel">Outro</label>
                </div>
                <div class="form-field">
        <label for="exampleFormControlSelect2" class="form-label"></label>
        <select class="form-control" id="exampleFormControlSelect2">
        <option>Qual seu estilo de musica:</option>
            <option value="1">Heavy Metal</option>
                <option value="2">Trash Metal</option>
             <option value="3">Rock geral</option>
             <option value="4">Apenas poucos derivados</option>
             <option value="5">outro(cai fora do meu site)</option>
        </select>
                </div>
                <div class="form-field">
        <label for="exampleFormControlTextarea1" class="form-label">Feedback</label>
        <textarea class="form-control" id="exampleFormControlTextarea1"></textarea>
                </div>
                <div class="form-group">
                    <button type="button" class="btn btn-primary" onclick="mensagem()">Salvar</button>
                </div>
        </form>
    </main>
    <script type="text/Javascript">
        function mensagem(){
            const msg = document.querySelector('#mensagem');
            msg.style.display = 'block';
            msg.textContent = 'Perfil salvo com sucesso!';
        }
        function validaCPF() {
            const cpf= document.querySelector('#cpf').value;
            //Implement CPF validation logic here
            console.log(cpf);
            if(cpf.length !== 11){
                const msg = document.querySelector('#mensagem');
                msg.style.display = 'block';
                msg.textContent = 'CPF inválido. Deve conter 11 dígitos'
            }
        }
    </script>
</body>
</html>
